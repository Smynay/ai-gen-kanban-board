<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cstyle%3Erect,polyline%7Bstroke:%234f46e5%7D@media(prefers-color-scheme:dark)%7Brect,polyline%7Bstroke:%23818cf8%7D%7D%3C/style%3E%3Crect x='3' y='3' width='18' height='18' rx='4'/%3E%3Cpolyline points='8 12 11 15 16 9'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Kanban</h1>
            <div class="header-actions">
                <button class="icon-btn" id="settings-btn" title="Настройки колонок">
    <svg width="20" height="20" viewBox="0 0 640 640" fill="currentColor">
        <path d="M259.1 73.5C262.1 58.7 275.2 48 290.4 48L350.2 48C365.4 48 378.5 58.7 381.5 73.5L396 143.5C410.1 149.5 423.3 157.2 435.3 166.3L503.1 143.8C517.5 139 533.3 145 540.9 158.2L570.8 210C578.4 223.2 575.7 239.8 564.3 249.9L511 297.3C511.9 304.7 512.3 312.3 512.3 320C512.3 327.7 511.8 335.3 511 342.7L564.4 390.2C575.8 400.3 578.4 417 570.9 430.1L541 481.9C533.4 495 517.6 501.1 503.2 496.3L435.4 473.8C423.3 482.9 410.1 490.5 396.1 496.6L381.7 566.5C378.6 581.4 365.5 592 350.4 592L290.6 592C275.4 592 262.3 581.3 259.3 566.5L244.9 496.6C230.8 490.6 217.7 482.9 205.6 473.8L137.5 496.3C123.1 501.1 107.3 495.1 99.7 481.9L69.8 430.1C62.2 416.9 64.9 400.3 76.3 390.2L129.7 342.7C128.8 335.3 128.4 327.7 128.4 320C128.4 312.3 128.9 304.7 129.7 297.3L76.3 249.8C64.9 239.7 62.3 223 69.8 209.9L99.7 158.1C107.3 144.9 123.1 138.9 137.5 143.7L205.3 166.2C217.4 157.1 230.6 149.5 244.6 143.4L259.1 73.5zM320.3 400C364.5 399.8 400.2 363.9 400 319.7C399.8 275.5 363.9 239.8 319.7 240C275.5 240.2 239.8 276.1 240 320.3C240.2 364.5 276.1 400.2 320.3 400z"/>
    </svg>
</button>
                <button class="icon-btn icon-btn-primary" id="add-btn" title="Добавить задачу">+</button>
            </div>
        </div>
        <div class="board" id="board"></div>
    </div>

    <div class="modal-overlay" id="add-modal">
        <div class="modal">
            <p class="modal-text">Новая задача</p>
            <form id="add-form">
                <input type="text" id="add-input" placeholder="Что нужно сделать?" autocomplete="off" required>
                <div class="add-colors-info" style="margin: 12px 0; font-size: 13px; color: #888;">
                    Выберите колонку
                </div>
                <div class="column-selector" id="column-selector"></div>
                <div class="modal-actions" style="margin-top: 20px;">
                    <button type="button" class="modal-btn modal-btn-cancel" id="add-cancel">Отмена</button>
                    <button type="submit" class="modal-btn modal-btn-confirm" style="background:#4f46e5;">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <p class="modal-text">Удалить задачу?</p>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" id="modal-cancel">Отмена</button>
                <button class="modal-btn modal-btn-confirm" id="modal-confirm">Удалить</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal modal-settings">
            <div class="modal-archive-header">
                <h3>Настройки колонок</h3>
                <button class="modal-close-btn" id="settings-close">&times;</button>
            </div>
            <div id="settings-list"></div>
            <button class="add-column-btn" id="add-column-btn">+ Добавить колонку</button>
            <div class="settings-divider"></div>
            <div class="settings-section">
                <div class="settings-section-title">Архив</div>
                <label class="toggle settings-row">
                    <input type="checkbox" id="show-archive-toggle">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">Показывать колонку архива</span>
                </label>
                <div class="settings-row settings-restore">
                    <span class="settings-restore-label">Восстанавливать задачи в колонку:</span>
                    <select id="restore-column-select" class="settings-select"></select>
                </div>
            </div>
            <div class="settings-section">
                <div class="settings-section-title">Бэклог</div>
                <label class="toggle settings-row">
                    <input type="checkbox" id="show-backlog-toggle">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">Показывать колонку бэклога</span>
                </label>
                <div class="settings-row settings-restore">
                    <span class="settings-restore-label">Восстанавливать задачи в колонку:</span>
                    <select id="backlog-restore-select" class="settings-select"></select>
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" id="settings-close-btn">Закрыть</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="archive-modal">
        <div class="modal modal-archive">
            <div class="modal-archive-header">
                <h3>Архив</h3>
                <button class="modal-close-btn" id="archive-close">&times;</button>
            </div>
            <div id="archive-list"></div>
        </div>
    </div>

    <div class="modal-overlay" id="backlog-modal">
        <div class="modal modal-archive">
            <div class="modal-archive-header">
                <h3>Бэклог</h3>
                <button class="modal-close-btn" id="backlog-close">&times;</button>
            </div>
            <div id="backlog-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
